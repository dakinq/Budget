<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Finanzcheck" />
  <title>Finanzcheck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #273549; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #60a5fa; --green: #4ade80;
      --red: #f87171; --radius: 16px;
    }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* Welcome */
    #welcome-screen {
      align-items: center; justify-content: center; padding: 40px 24px;
      background: radial-gradient(ellipse at 50% 0%, #1e3a5f 0%, var(--bg) 60%);
      text-align: center;
    }
    .welcome-logo { font-size: 64px; margin-bottom: 12px; }
    .welcome-title { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
    .welcome-sub { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 40px; }
    .welcome-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--accent); color: #0f172a; border: none; border-radius: 14px;
      padding: 16px 32px; font-size: 17px; font-weight: 700; cursor: pointer;
      width: 100%; max-width: 300px;
    }
    .welcome-note { margin-top: 16px; font-size: 12px; color: var(--muted); }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .app-title { font-size: 18px; font-weight: 700; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn {
      border-radius: 10px; padding: 7px 13px; font-size: 13px;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    }
    .btn.primary { background: var(--accent); color: #0f172a; font-weight: 600; border-color: var(--accent); }
    .btn.danger  { color: var(--red); border-color: var(--red); background: transparent; }

    /* Month pills */
    .month-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .month-scroll::-webkit-scrollbar { display: none; }
    .month-pill {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); padding: 6px 14px; font-size: 13px; white-space: nowrap; cursor: pointer;
    }
    .month-pill.active { background: var(--accent); border-color: var(--accent); color: #0f172a; font-weight: 600; }

    /* Cards */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .card-val { font-size: 18px; font-weight: 700; }
    .red { color: var(--red); } .green { color: var(--green); } .blue { color: var(--accent); } .gray { color: var(--muted); font-size:14px; }

    /* Section */
    .sec { padding: 0 16px 20px; }
    .sec-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }

    /* Pie */
    .pie-wrap { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    canvas { display: block; flex-shrink: 0; }
    .cat-rows { flex: 1; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
    .cat-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
    .cat-row:hover { background: var(--surface2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cat-name { flex: 1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-amt { font-size: 12px; font-weight: 600; color: var(--red); white-space: nowrap; }

    /* Bar chart */
    .bar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

    /* Upload */
    .upload-zone {
      background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 28px; text-align: center; cursor: pointer; margin-bottom: 12px;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .up-icon { font-size: 34px; margin-bottom: 6px; }
    .up-text { font-size: 15px; font-weight: 500; }
    .up-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* TX list */
    .tx-list { display: flex; flex-direction: column; gap: 2px; }
    .tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border-radius: 12px; }
    .tx-ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .tx-amt.neg { color: var(--red); } .tx-amt.pos { color: var(--green); }

    .empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 14px; line-height: 1.8; }
    .divider { height: 1px; background: var(--border); margin: 0 16px 16px; }
    #csv-input { display: none; }

    /* Loading */
    #loading {
      position: fixed; inset: 0; background: rgba(15,23,42,0.9);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 999;
    }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-txt { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="load-txt" id="load-txt">Laden…</div></div>
<input type="file" id="csv-input" accept=".csv" />

<!-- WELCOME -->
<div id="welcome-screen" class="screen active">
  <div class="welcome-logo">💰</div>
  <div class="welcome-title">Finanzcheck</div>
  <div class="welcome-sub">Lade dein Sparkasse- oder ZKB-CSV hoch und sieh sofort, wo dein Geld hingeht.</div>
  <button class="welcome-btn" onclick="triggerUpload()">📂 CSV hochladen</button>
  <p class="welcome-note">Alle Daten bleiben lokal auf deinem Gerät.</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:22px">💰</span>
      <span class="app-title">Finanzcheck</span>
    </div>
    <div class="topbar-actions">
      <button class="btn primary" onclick="triggerUpload()">📂 CSV</button>
      <button class="btn danger" onclick="clearData()">🗑</button>
    </div>
  </div>

  <div class="month-scroll" id="months"></div>

  <div class="cards">
    <div class="card"><div class="card-label">Ausgaben</div><div class="card-val red" id="c-exp">—</div></div>
    <div class="card"><div class="card-label">Einnahmen</div><div class="card-val green" id="c-inc">—</div></div>
    <div class="card"><div class="card-label">Bilanz</div><div class="card-val blue" id="c-bal">—</div></div>
    <div class="card"><div class="card-label">Buchungen</div><div class="card-val gray" id="c-cnt">—</div></div>
  </div>

  <div class="sec">
    <div class="sec-title">Nach Kategorie</div>
    <div class="pie-wrap">
      <canvas id="pie" width="110" height="110"></canvas>
      <div class="cat-rows" id="cat-rows"></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">Monatsverlauf</div>
    <div class="bar-wrap"><canvas id="bar" width="280" height="140" style="width:100%;height:auto"></canvas></div>
  </div>

  <div class="divider"></div>

  <div class="sec">
    <div class="upload-zone" onclick="triggerUpload()">
      <div class="up-icon">📄</div>
      <div class="up-text">Weiteres CSV hochladen</div>
      <div class="up-sub">Sparkasse & ZKB werden erkannt</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">Buchungen</div>
    <div class="tx-list" id="tx-list"></div>
  </div>
  <div style="height:32px"></div>
</div>

<script>
// ── Kategorien ──
const CATS = {
  lebensmittel: { label:"Lebensmittel", icon:"🛒", color:"#4ade80", kw:["migros","coop","aldi","lidl","spar","volg","denner","rewe","edeka","netto","penny","kaufland","bäckerei","bakery","metzg","supermarkt"] },
  restaurant:   { label:"Restaurant",   icon:"🍽️", color:"#fb923c", kw:["restaurant","café","cafe","bar","pizza","kebab","sushi","mcdonald","burger king","kfc","starbucks","subway","gasthaus","takeaway","lieferando"] },
  transport:    { label:"Transport",    icon:"🚗", color:"#60a5fa", kw:["sbb","zvv","bvg","db ag","deutsche bahn","tankstelle","shell","bp ","esso","parkhaus","parking","uber","taxi","flixbus","easyjet","ryanair","swiss"] },
  shopping:     { label:"Shopping",     icon:"🛍️", color:"#c084fc", kw:["amazon","zalando","zara","h&m","ikea","digitec","galaxus","mediamarkt","saturn","globus","interdiscount","apple store","google play"] },
  gesundheit:   { label:"Gesundheit",   icon:"💊", color:"#f472b6", kw:["apotheke","pharmacy","arzt","spital","klinik","zahnarzt","optiker","fitness","gym","drogerie","dm ","rossmann"] },
  wohnen:       { label:"Wohnen",       icon:"🏠", color:"#fbbf24", kw:["miete","nebenkosten","strom","ewz","energie","gas","wasser","versicherung","zurich","allianz","axa","helvetia","sunrise","swisscom","salt","upc"] },
  freizeit:     { label:"Freizeit",     icon:"🎉", color:"#38bdf8", kw:["netflix","spotify","disney","steam","playstation","xbox","nintendo","kino","theater","konzert","booking","airbnb","hotel"] },
  sonstiges:    { label:"Sonstiges",    icon:"📦", color:"#94a3b8", kw:[] }
};

function categorize(desc) {
  const l = (desc||"").toLowerCase();
  for (const [k,c] of Object.entries(CATS)) {
    if (k==="sonstiges") continue;
    if (c.kw.some(w => l.includes(w))) return k;
  }
  return "sonstiges";
}

function parseDate(s) {
  if (!s) return null;
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) { let y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[2]-1,+m[1]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const header = lines[0];
  const sep = header.includes(";") ? ";" : ",";
  const isZKB = /buchungsdatum|valuta/i.test(header);
  const isSPK = /auftragskonto|beguenstigter|glaeubiger/i.test(header);
  const txs = [];

  for (let i=1; i<lines.length; i++) {
    const cols = lines[i].split(sep).map(c=>c.replace(/^"|"$/g,"").trim());
    if (cols.length < 3) continue;
    let date, amount, desc;

    if (isZKB) {
      date = parseDate(cols[0]);
      const deb = parseFloat((cols[2]||"0").replace(/['\s]/g,"").replace(",",".")) || 0;
      const cre = parseFloat((cols[3]||"0").replace(/['\s]/g,"").replace(",",".")) || 0;
      amount = cre > 0 ? cre : -deb;
      desc = (cols[5]||cols[4]||"").replace(/\s+/g," ").trim();
    } else if (isSPK) {
      date = parseDate(cols[1]);
      desc = [cols[3],cols[4]].filter(Boolean).join(" – ").replace(/\s+/g," ").trim();
      amount = parseFloat((cols[7]||"0").replace(/\./g,"").replace(",",".")) || 0;
    } else {
      date = parseDate(cols[0]);
      desc = cols[1]||"";
      amount = parseFloat((cols[2]||"0").replace(",",".")) || 0;
    }

    if (!date || amount===0) continue;
    txs.push({ date: date.toISOString(), amount, description: desc, category: categorize(desc) });
  }
  return txs;
}

// ── Charts ──
function drawPie(canvas, data) {
  const ctx = canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return;
  const cx=W/2,cy=H/2,r=Math.min(cx,cy)-3;
  let angle=-Math.PI/2;
  for (const d of data) {
    const slice=(d.value/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice); ctx.closePath();
    ctx.fillStyle=d.color; ctx.fill();
    ctx.strokeStyle="#0f172a"; ctx.lineWidth=2; ctx.stroke();
    angle+=slice;
  }
  ctx.beginPath(); ctx.arc(cx,cy,r*0.5,0,Math.PI*2);
  ctx.fillStyle="#0f172a"; ctx.fill();
}

function drawBar(canvas, labels, values) {
  const ctx = canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const p={t:18,r:6,b:32,l:38};
  const cW=W-p.l-p.r, cH=H-p.t-p.b;
  const max=Math.max(...values,1);
  const gap=cW/Math.max(labels.length,1);
  const bW=gap*0.55;
  for(let i=0;i<=4;i++){
    const y=p.t+cH-(cH/4)*i;
    ctx.strokeStyle="#334155"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(p.l,y); ctx.lineTo(W-p.r,y); ctx.stroke();
    ctx.fillStyle="#64748b"; ctx.font="9px system-ui"; ctx.textAlign="right";
    const v=Math.round(max/4*i);
    ctx.fillText(v>999?(v/1000).toFixed(1)+"k":v, p.l-2, y+3);
  }
  values.forEach((v,i)=>{
    const x=p.l+gap*i+(gap-bW)/2;
    const bH=(v/max)*cH;
    const y=p.t+cH-bH;
    const g=ctx.createLinearGradient(0,y,0,y+bH);
    g.addColorStop(0,"#60a5fa"); g.addColorStop(1,"#60a5fa33");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.roundRect(x,y,bW,bH,3); ctx.fill();
    ctx.fillStyle="#94a3b8"; ctx.font="9px system-ui"; ctx.textAlign="center";
    ctx.fillText(labels[i], x+bW/2, H-p.b+11);
    if(v>0) ctx.fillText(v>999?(v/1000).toFixed(1)+"k":Math.round(v), x+bW/2, y-3);
  });
}

// ── Helpers ──
const MN=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function mk(d){const dt=new Date(d);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");}
function ml(k){const[y,m]=k.split("-");return MN[+m-1]+" "+y;}
function chf(n){return(n<0?"−":"")+"CHF "+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,"'");}

// ── State (in-memory only) ──
let allTxs = [];
let activeMonth = null;
let activeCat = null;

function render() {
  const exp = allTxs.filter(t=>t.amount<0);
  const inc = allTxs.filter(t=>t.amount>0);
  const months = [...new Set(allTxs.map(t=>mk(t.date)))].sort().reverse();
  if (!activeMonth && months.length) activeMonth = months[0];

  // Month pills
  document.getElementById("months").innerHTML = months.map(m=>
    `<button class="month-pill${m===activeMonth?" active":""}" onclick="selMonth('${m}')">${ml(m)}</button>`
  ).join("");

  const mExp = exp.filter(t=>mk(t.date)===activeMonth);
  const mInc = inc.filter(t=>mk(t.date)===activeMonth);
  const totExp = mExp.reduce((s,t)=>s+Math.abs(t.amount),0);
  const totInc = mInc.reduce((s,t)=>s+t.amount,0);

  document.getElementById("c-exp").textContent = chf(-totExp);
  document.getElementById("c-inc").textContent = chf(totInc);
  document.getElementById("c-bal").textContent = chf(totInc-totExp);
  document.getElementById("c-cnt").textContent = mExp.length+" Buchungen";

  // Categories
  const byCat={};
  mExp.forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+Math.abs(t.amount); });
  const catData=Object.entries(byCat).map(([k,v])=>({
    key:k,label:CATS[k].label,icon:CATS[k].icon,color:CATS[k].color,value:v
  })).sort((a,b)=>b.value-a.value);

  drawPie(document.getElementById("pie"), catData);

  document.getElementById("cat-rows").innerHTML = catData.map(c=>
    `<div class="cat-row" onclick="selCat('${c.key}')">
      <span class="dot" style="background:${c.color}"></span>
      <span style="font-size:12px">${c.icon}</span>
      <span class="cat-name">${c.label}</span>
      <span class="cat-amt">${chf(-c.value)}</span>
    </div>`
  ).join("") || `<div style="color:var(--muted);font-size:13px;padding:6px">Keine Ausgaben</div>`;

  // Bar chart
  const last6=months.slice(0,6).reverse();
  drawBar(document.getElementById("bar"),
    last6.map(m=>ml(m).split(" ")[0]),
    last6.map(m=>exp.filter(t=>mk(t.date)===m).reduce((s,t)=>s+Math.abs(t.amount),0))
  );

  // TX list
  let list = activeCat ? mExp.filter(t=>t.category===activeCat) : mExp;
  list = [...list].sort((a,b)=>new Date(b.date)-new Date(a.date));

  document.getElementById("tx-list").innerHTML = list.slice(0,40).map(t=>{
    const c=CATS[t.category], d=new Date(t.date);
    return `<div class="tx-row">
      <div class="tx-ico" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
      <div class="tx-info">
        <div class="tx-desc">${(t.description||"").slice(0,44)}${(t.description||"").length>44?"…":""}</div>
        <div class="tx-meta">${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()} · ${c.label}</div>
      </div>
      <div class="tx-amt ${t.amount<0?"neg":"pos"}">${chf(t.amount)}</div>
    </div>`;
  }).join("") || `<div class="empty">Keine Buchungen für diesen Monat.</div>`;
}

function selMonth(m){ activeMonth=m; activeCat=null; render(); }
function selCat(k){ activeCat=activeCat===k?null:k; render(); document.getElementById("tx-list").scrollIntoView({behavior:"smooth"}); }

async function handleFile(file) {
  document.getElementById("loading").style.display="flex";
  document.getElementById("load-txt").textContent="Verarbeite CSV…";
  await new Promise(r=>setTimeout(r,30));
  const text = await file.text();
  const newTxs = parseCSV(text);
  document.getElementById("loading").style.display="none";
  if (!newTxs.length) { alert("Keine Buchungen gefunden.\nBitte Sparkasse- oder ZKB-CSV verwenden."); return; }
  allTxs = [...allTxs, ...newTxs];
  activeMonth=null; activeCat=null;
  document.getElementById("welcome-screen").classList.remove("active");
  document.getElementById("dashboard-screen").classList.add("active");
  render();
  alert("✅ "+newTxs.length+" Buchungen importiert!");
}

function triggerUpload(){ document.getElementById("csv-input").click(); }

function clearData(){
  if(!confirm("Alle Daten löschen?")) return;
  allTxs=[]; activeMonth=null; activeCat=null;
  document.getElementById("dashboard-screen").classList.remove("active");
  document.getElementById("welcome-screen").classList.add("active");
}

document.getElementById("csv-input").addEventListener("change", async e=>{
  if(e.target.files[0]) await handleFile(e.target.files[0]);
  e.target.value="";
});
</script>
</body>
</html>
